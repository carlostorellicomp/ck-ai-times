name: Atualizar The CK AI Times (Diário 07h00 BRT)

on:
  schedule:
    # Todo dia às 07:00 horário de Brasília (10:00 UTC)
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Coletar 20 fontes reais + Ranking Top 50 LLMs (Artificial Analysis)
        run: python coletor_ck_ai_times.py

      - name: Gerar index.html editorial (Zero Invenções)
        run: python gerar_jornal_ck_ai_times.py

      - name: Salvar edição atualizada no repositório
        run: |
          git config user.name "CK AI Times Bot"
          git config user.email "bot@ckintelligence.com.br"
          git add index.html ultima-edicao.html dados/latest.json
          git diff --staged --quiet || git commit -m "chore: edição diária automática $(date -u +'%Y-%m-%d')"
          git push

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload do artefato estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
