name: Atualizar The CK AI Times (Automático 06h17 + 07h43 BRT)

on:
  schedule:
    # 06:17 BRT (09:17 UTC) — minuto fora de pico para garantir edição no ar antes das 07h00
    - cron: '17 9 * * *'
    # 07:43 BRT (10:43 UTC) — redundância automática + captura de newsletters da manhã dos EUA
    - cron: '43 10 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Coletar 20 fontes reais + Ranking Top 50 LLMs (Artificial Analysis)
        run: python coletor_ck_ai_times.py

      - name: Gerar index.html editorial (Zero Invenções)
        run: python gerar_jornal_ck_ai_times.py

      - name: Salvar edição atualizada no repositório
        run: |
          git config user.name "CK AI Times Bot"
          git config user.email "bot@ckintelligence.com.br"
          git add index.html ultima-edicao.html dados/latest.json dados/historico_capa.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: edição diária automática $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase -X ours origin main || true
            git push
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload do artefato estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
